<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify</title>
    <link rel="icon" type="image/svg+xml" href="images/fovicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="nav">
        <img src="images/logo.svg" alt="Shopify Logo" class="logo">
        <div class="homeBtn">
            <img src="images/home.svg" alt="home Logo" class="home">
            <div class="searchBar">
                <img src="images/search.svg" alt="search Logo" class="search">
                <input type="text" placeholder="Search..." id="text" name="text">
            </div>
            <div class="rightNav">
                <div style="display: flex;justify-self: end;width: 20px;">
                    <img src="images/hamburger.svg" alt="hamburger" class="hamburger1">
                </div>
                <ul class="navList">
                    <li class="crossLogo"><img src="images/corss.svg" alt="Cross" class="cross1"></li>
                    <li>Premium</li>
                    <li>Support</li>
                    <li>Download</li>
                    <li class="line"></li>
                    <li>Install app</li>
                    <li>Sign up</li>
                    <li class="login">Log in</li>
                </ul>
            </div>
        </div>

    </div>
    <div class="main">
        <div class="left">
            <div style="display: flex; justify-content: end; padding-right: 20px;">
                <img src="images/corss.svg" alt="cross" class="cross">
            </div>
            <div class="head">
                <div class="library">
                    <img src="images/library.svg" alt="library">
                    <h1>Your library</h1>
                </div>
                <button class="createBtn">
                    <img src="images/plus.svg" alt="plus" class="plus"> Create
                </button>
            </div>
            <div class="playlist">
                <ul class="listOfSongs">

                </ul>
            </div>

            <div class="footer">
                <ul>
                    <li>Legal</li>
                    <li>Safety&Privacy Center</li>
                    <li>Privacy Policy</li>
                    <li>Cookies</li>
                    <li>About Ads</li>
                    <li>Accessibility</li>
                </ul>
                <button class="language">
                    <img src="images/world.svg" alt="world" class="plus"> English
                </button>
            </div>

        </div>


        <div class="right">
            <div style="display: flex; align-items: center;">
                <img src="images/hamburger.svg" alt="Hamburger" class="hamburger">

                <h1>Trending Songs</h1>
            </div>
            <div class="cards">
            </div>
            <div class="playBar">
                <div class="aboveBar">
                    <div class="songName"></div>
                    <div class="playerbtns">
                        <img src="images/previous.svg" alt="previous" id="previousBtn">
                        <img src="images/play.png" alt="paly" class="playbtn" id="play">
                        <img src="images/next.svg" alt="next" id="nextBtn">
                    </div>
                    <div class="timeVolume">
                        <div class="timeOfSong"></div>
                        <div class="volumeContainer"></div>  
                    </div>
                </div>
                <div class="seekBar">
                    <div class="circle">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script1.js"></script>
</body>

</html>
